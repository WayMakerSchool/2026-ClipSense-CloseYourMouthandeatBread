; PlatformIO 빌드 설정 (arduino-cli 대안).
;
;   pio run                      컴파일만
;   pio run -t upload            보드에 업로드
;   pio device monitor -b 115200 직렬 로그
;
; arduino-cli를 쓰는 경우는 firmware/README.md 참고.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; XIAO ESP32S3 Sense는 8MB OPI PSRAM을 쓴다. 프레임버퍼를 PSRAM에 두려면
; 반드시 켜야 한다(끄면 fb_count가 1로 내려가고 지연이 커진다).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; .ino와 헤더가 clipsense_cam/ 아래에 있다.
src_dir = clipsense_cam
