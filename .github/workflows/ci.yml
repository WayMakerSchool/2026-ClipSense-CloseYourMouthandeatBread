name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate synthetic videos
        # test_digits.py가 data/test_countdown.mp4(gitignore)를 읽으므로 단위 테스트보다 먼저 생성한다.
        run: python scripts/make_test_video.py
      - name: Run unit and robustness tests
        run: python scripts/run_unit_tests.py
      - name: Run end-to-end video pipeline
        run: python scripts/run_pipeline_test.py

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Compile Android debug APK
        run: flutter build apk --debug --dart-define=TDATA_KEY=ci-placeholder
